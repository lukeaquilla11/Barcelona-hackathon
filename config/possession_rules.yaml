# Transparent configuration for temporal possession experiments.
#
# These values are hypotheses/configuration, not labels written by hand for a
# particular frame. Keep fitted HSMM parameters in a separate artifact file.

timeline:
  fps: 25
  short_pass_max_seconds: 1.0
  long_ball_max_seconds: 5.0
  persistence_window_seconds: 1.0

pitch:
  length_m: 105.3
  width_m: 68.0

anchors:
  stable_control_max_distance_m: 2.0
  stable_control_min_frames: 8
  minimum_distance_margin_m: 1.0
  minimum_team_persistence: 0.80
  low_pressure_opponent_distance_m: 5.0
  stable_distance_std_max_m: 0.75
  stable_ball_speed_max_mps: 3.0
  local_control_speed_max_mps: 5.0
  long_ball_confidence_penalty: 0.45

# Ordered anchor policy. The first available trustworthy source wins. Scenario
# evidence without a team anchor is diagnostic only and leaves the frame
# unresolved for the later trajectory resolver.
anchor_hierarchy:
  ordered_sources:
    - restart_control_anchor_team
    - pressure_anchor_team
    - anchor_team
  unresolved_team: null
  unresolved_source: NO_ANCHOR

reception:
  pre_flight_window_frames: 8
  post_control_window_frames: 10
  interpolation_max_frames: 25
  projection_horizon_seconds: 0.5
  minimum_speed_drop_mps: 2.0
  maximum_control_distance_m: 2.5
  minimum_receiver_margin_s: 0.25

reception_signal:
  near_ball_distance_m: 2.5
  local_min_window_frames: 9
  persistence_window_frames: 10
  controlled_persistence_fraction: 0.50
  sustained_persistence_fraction: 0.70
  short_touch_persistence_fraction: 0.35
  minimum_signal_score: 0.55
  minimum_ball_deceleration_mps: 0.0

trajectory:
  # Diagnostics for internal ball-coordinate gaps. These are deliberately
  # broad physical gates, not labels fitted to the public sanity frames.
  context_frames: 5
  maximum_implied_ball_speed_mps: 40.0
  maximum_direction_change_rad: 1.5708
  # Missing-ball interpretation diagnostics. These are evidence gates, not
  # labels: smooth same-player motion supports dribble continuity; a sharp
  # speed change or nearby opponent raises pass/tackle risk.
  same_player_speed_match_max_mps: 3.0
  sharp_gap_speed_change_mps: 8.0
  tackle_opponent_distance_m: 2.5
  nearby_gap_displacement_m: 3.0

restart:
  active_ball_speed_mps: 1.0
  minimum_active_run_frames: 3
  minimum_dead_run_frames: 5
  post_restart_hold_frames: 25
  post_restart_hold_frames_by_type:
    Corner Kick: 50
    Goal Kick: 50
    Free Kick: 50
    Throw-in: 25
    Kick Off (Start): 25
    Kick Off (After Goal): 25

dead_ball_evidence:
  # A stationary missing-ball interval is treated as a stoppage only when the
  # whole tracked team has also settled. These are physical hypotheses, not
  # values fitted to the public labels.
  low_activity_median_mps: 1.5
  low_activity_p90_mps: 2.0
  minimum_low_motion_frames: 25
  maximum_out_of_bounds_bridge_frames: 75
  # Diagnostic only until public sanity evaluation confirms it improves both
  # per-frame and possession-spell quality.
  minimum_out_of_bounds_run_frames: 2
  out_of_bounds_boundary_tolerance: 0.0

transition_forecast:
  switch_risk_threshold: 0.70
  followthrough_window_frames: 8
  confirmation_min_frames: 4
  anchor_lookahead_frames: 50

bridging:
  short_pass_max_frames: 25
  long_ball_max_frames: 125
  required_post_reception_frames: 10
  minimum_ball_speed_mps: 8.0
  long_ball_acceleration_mps2: 20.0
  use_confirmed_transition_switch: true

output:
  outside_graded_label: X
  dead_ball_label: D
  missing_evidence_policy: prefer_previous

decoder:
  max_team_spike_frames: 12

hmm:
  self_transition: 0.995
  team_switch_transition: 0.002
  dead_ball_transition: 0.003

# Broadcast quality gates. These identify evidence windows; they do not assign
# possession and do not provide a tactical-to-broadcast frame mapping.
broadcast:
  fps: 25
  audit_block_frames: 25
  minimum_visible_players: 12
  expected_players: 22
  maximum_reprojection_error: 0.75
  minimum_geometry_fraction: 0.80

competition:
  # Match-specific evaluation ranges; omit this for a non-competition match.
  graded_ranges:
    - [11185, 90651]
    - [110808, 190197]
